<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Owner quote checkout | Indy Mow Masters</title><link rel="stylesheet" href="/luxe.css"><body class="lx"><main class="lx-wrap lx-sec"><h1>Owner quote checkout</h1><p id="mode">Checking payment environment…</p><p id="owner-account" hidden><a href="/account.html">Customer and owner portal</a>. For live payment links, enter your private owner key below.</p><form id="quote" class="lx-form"><div class="lx-field"><label for="key">Owner access key</label><input id="key" type="password" required autocomplete="off"></div><div class="lx-field"><label for="description">Approved service description</label><input id="description" maxlength="120" required></div><div class="lx-field"><label for="amount">Approved total (USD)</label><input id="amount" type="number" min="1" max="10000" step="0.01" required></div><button class="lx-btn lx-btn--gold" type="submit" disabled>Create payment link</button></form><p id="status" role="status"></p><a id="link" hidden target="_blank" rel="noopener noreferrer">Open Square checkout</a><form id="payment-status" class="lx-form"><div class="lx-field"><label for="order-id">Square order ID</label><input id="order-id" required maxlength="192" autocomplete="off"></div><button class="lx-btn lx-btn--gold" type="submit">Check payment status</button></form><p id="payment-result" role="status"></p></main><script src="/owner-square.js" defer></script></body></html>
