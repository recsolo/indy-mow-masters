name: Production feature regression
on:
  push:
    branches: [verify/production-feature-regression, seo/indianapolis-seasonal-search]
  pull_request:
    branches: [seo/indianapolis-seasonal-search]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: node --test scripts/production-feature-regression.test.cjs
